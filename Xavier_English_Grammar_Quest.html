r{height:10px;background:#172143;border:1px solid #455980;border-radius:20px;overflow:hidden;margin:15px 0 24px}.progressInner{height:100%;background:linear-gradient(90deg,#36cdb5,#c8fc99);transition:width .2s ease;width:0}.questionTitle{margin:7px 0 12px;line-height:1.26;font-size:clamp(23px,4vw,31px)}.prompt{background:#111c3d;border:1px solid #415e90;border-radius:16px;padding:18px;margin:15px 0 18px}.prompt label{display:block;color:#a2bce8;font-size:12px;letter-spacing:.13em;text-transform:uppercase;font-weight:800;margin-bottom:7px}.prompt p{margin:0;font-size:clamp(19px,3.4vw,25px);font-weight:780;line-height:1.4}.options{display:grid;gap:11px;margin:16px 0}.option{width:100%;display:flex;align-items:center;gap:13px;min-height:62px;padding:11px 14px;border-radius:14px;border:1px solid #667baf;background:#24345c;color:white;font:600 16px/1.45 inherit;text-align:left;cursor:pointer}.option:hover:not(:disabled){background:#304874;border-color:#9be5da}.option .letter{flex:none;display:grid;place-items:center;width:33px;height:33px;border:1px solid #7892c6;border-radius:9px;color:#e2edff;background:#142347;font-size:14px;font-weight:900}.option:disabled{opacity:.65}.timerbox{border:1px solid #cfba76;border-radius:13px;background:#453a37;color:#ffefa9;padding:12px 14px;margin:13px 0;display:flex;align-items:center;gap:13px;font-weight:750}.timerbox.ready{background:#174442;border-color:#57cdbd;color:#bdfff2}.timerCircle{border:3px solid currentColor;border-radius:50%;width:42px;height:42px;flex:none;display:grid;place-items:center;font-size:18px;font-variant-numeric:tabular-nums}.buildAnswer{min-height:72px;border:2px dashed #7488bb;background:#111c3d;border-radius:15px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}.buildAnswer.empty:before{content:"Tik de woorden hieronder in de goede volgorde";color:#97a9d3;font-size:14px;padding:11px 5px}.chipArea{display:flex;flex-wrap:wrap;gap:9px;margin:16px 0}.chip{border:1px solid #93a8d2;background:#e3edff;border-radius:10px;padding:9px 13px;color:#152349;min-height:43px;font:800 16px/1.3 inherit;cursor:pointer}.chip.chosen{background:#26395f;color:white;border-color:#7a9ad1}.tip{margin:19px 0 0;border-radius:14px;padding:14px;background:#263454;border-left:4px solid var(--yellow);color:#f1e9c8;font-size:14px}.feedback{padding:20px;border-radius:18px;margin:16px 0;border:1px solid #5e81a4;background:#1c3554}.feedback.good{background:#17433e;border-color:#59b9a8}.feedback.bad{background:#513341;border-color:#dd8a9d}.feedback h3{font-size:24px;margin:0 0 8px}.feedback .rightAnswer{font-weight:900;font-size:19px;color:#fff;margin:9px 0}.feedback p{margin:7px 0;color:#e4edf9}.feedback .explain{color:#f2e9b9}.wordBank{font-size:13px;color:var(--muted);margin-top:13px}.explanation{background:#152241;border:1px solid #4f6694;padding:17px;border-radius:15px;margin:18px 0;color:#e4edff}.explanation strong{color:#fff}.explanation p{margin:5px 0 0}.rules{display:grid;gap:11px;margin-top:15px}.rule{background:#152346;border:1px solid #526b98;border-radius:14px;padding:14px;font-size:15px}.rule strong{display:block;color:#8ce9da;margin-bottom:4px}.rule em{color:#ffdf85;font-style:normal}.resultNumber{text-align:center;font-size:clamp(50px,13vw,82px);line-height:1.2;font-weight:900;color:var(--yellow);margin:15px 0 3px}.resultSub{text-align:center;color:#d0dcf7;margin:0 0 20px}.report{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0}.report div{border:1px solid #516999;background:#1a2a52;border-radius:12px;padding:12px;text-align:center;font-weight:800}.report small{display:block;color:var(--muted);font-size:11px;font-weight:600;margin:0 0 5px}.wrongList{display:grid;gap:9px;margin-top:12px}.wrongItem{padding:13px;border-radius:12px;background:#172445;border:1px solid #4b5e8a;font-size:14px}.wrongItem strong{display:block;color:#c8f6ed;margin:7px 0 2px}.wrongItem small{color:#becae8}.foot{text-align:center;color:#a3b1d4;font-size:12px;margin:20px 0 0}.miniStat{font-size:14px;color:var(--muted)}.hidden{display:none!important}.tts{font:inherit;font-size:13px;font-weight:800;color:#e2fcf7;background:transparent;border:1px solid #7fa7b9;border-radius:12px;padding:10px 12px;cursor:pointer}.tts:disabled{opacity:.5}.howto{color:var(--muted);font-size:13px}.confetti{font-size:38px;text-align:center;margin:8px 0}.examAlert{border:1px solid #b9a964;color:#f5e7a9;padding:15px 16px;background:#353043;border-radius:13px;margin-top:13px;font-size:14px}.footerActions{margin-top:20px;display:flex;flex-wrap:wrap;gap:9px}.record{font-size:12px;color:#acc3e8;margin-top:13px}.toggle{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px;margin-top:13px}.toggle input{width:18px;height:18px;accent-color:#66dfce}
@media(max-width:650px){.hero{grid-template-columns:1fr 90px}.planet{height:88px;width:88px;font-size:40px}.planet:after{inset:26px -12px;border-width:6px}.levelgrid{grid-template-columns:1fr}.modes{grid-template-columns:1fr}.modecard{min-height:120px}.panel{border-radius:20px}.report{grid-template-columns:1fr 1fr 1fr}.btn{width:100%}.btnrow .btn{flex:1;min-width:180px}.option{font-size:15px}.scorebox{padding:8px;font-size:12px}}

<script>
'use strict';
const LEVELS=[
{ id:'future', stone:'Stone 1.1',title:'Tijdmachine',emoji:'🛸',about:'Wat ga je doen? En wat zul je doen?',rules:[
 ['I am · he/she/it is · we/you/they are','<em>I am going to</em> call someone. / <em>She is going to</em> call someone.'],
 ['going to = van plan zijn','I <em>am not going to</em> send a picture.'],
 ['will / won’t = zal / zal niet','We <em>will</em> text him. / He <em>won’t</em> answer the phone.'] ]},
{ id:'jobs',stone:'Stone 1.2',title:'Beroepenplaneet',emoji:'👩‍🚀',about:'Wat wil je later worden?',rules:[
 ['De vraag','<em>What do you want to be</em> when you grow up?'],
 ['Het antwoord','When I grow up, I <em>want to be an astronaut.</em>'],
 ['a of an?','<em>An</em> astronaut (klinkerklank), maar <em>a</em> flight attendant.'],
 ['Eén of meer?','<em>He is a</em> police officer. / <em>They are</em> doctors.'] ]},
{ id:'chores',stone:'Stone 1.3',title:'Klusjeskasteel',emoji:'🏰',about:'Hoe vaak doe jij iets in huis?',rules:[
 ['Hoe vaak?','<em>never</em> = nooit · <em>sometimes</em> = soms · <em>often</em> = vaak · <em>usually</em> = meestal · <em>always</em> = altijd'],
 ['He en she krijgen vaak een -s','I <em>tidy</em> up. / He <em>tidies</em> up. / She <em>does</em> the dishes.'],
 ['Tijd achter de zin','<em>daily</em> = dagelijks · <em>weekly</em> = wekelijks · <em>monthly</em> = maandelijks'],
 ['Waar staat often?','<em>They often do</em> the dishes. Het woord often staat vóór do.'] ]}
];
// Question formats: choose one of four, or build the correct sentence by tapping its parts.
const BANK=[
{ id:'f1',level:'future',type:'mc',title:'Vertaal de zin',prompt:'Ik ga mijn telefoon opladen.',correct:'I am going to charge my phone.',wrong:['I is going to charge my phone.','I are going to charge my phone.','I will to charge my phone.'],why:'Bij I gebruik je am. Daarna zeg je going to + het werkwoord.'},
{ id:'f2',level:'future',type:'mc',title:'Kies de goede zin',prompt:'Zij gaat iemand bellen.',correct:'She is going to call someone.',wrong:['She are going to call someone.','She am going to call someone.','She going to call someone.'],why:'Bij she hoort is.'},
{ id:'f3',level:'future',type:'build',title:'Bouw de Engelse zin',prompt:'Wij gaan geen foto sturen.',tokens:['We','are','not','going','to','send','a picture.'],why:'We are not going to ... betekent: wij gaan niet ...'},
{ id:'f4',level:'future',type:'mc',title:'Maak de zin af',prompt:'They ___ going to send a picture.',correct:'are',wrong:['am','is','will'],why:'They hoort bij are.'},
{ id:'f5',level:'future',type:'mc',title:'Vertaal de zin',prompt:'Ik zal hem een berichtje sturen.',correct:'I will text him.',wrong:['I wills text him.','I will to text him.','I am will text him.'],why:'Na will komt meteen het hele werkwoord: will text.'},
{ id:'f6',level:'future',type:'build',title:'Bouw de Engelse zin',prompt:'Hij zal de telefoon niet opnemen.',tokens:['He','will','not','answer','the phone.'],why:'Will not kan ook korter: won’t. Daarna answer, zonder -s.'},
{ id:'f7',level:'future',type:'mc',title:'Wat is de juiste vertaling?',prompt:'Wij zullen een bericht typen.',correct:'We will type a message.',wrong:['We will typing a message.','We are will type a message.','We will to type a message.'],why:'Will + type, niet typing of to type.'},
{ id:'f8',level:'future',type:'mc',title:'Kies de juiste ontkenning',prompt:'He ___ going to call someone.',correct:'is not',wrong:['are not','am not','does not'],why:'He is not going to ... betekent hij gaat niet ...'},
{ id:'f9',level:'future',type:'build',title:'Bouw de Engelse zin',prompt:'Ik ga geen foto sturen.',tokens:['I','am','not','going','to','send','a picture.'],why:'I am not going to ... is het juiste patroon.'},
{ id:'f10',level:'future',type:'mc',title:'Kies het goede antwoord',prompt:'She ___ answer the phone. (Zij zal de telefoon niet opnemen.)',correct:'won’t',wrong:['don’t','isn’t','aren’t'],why:'Won’t is de verkorting van will not.'},
{ id:'f11',level:'future',type:'mc',title:'Vertaal de zin',prompt:'Jullie gaan iemand bellen.',correct:'You are going to call someone.',wrong:['You is going to call someone.','You am going to call someone.','You will going to call someone.'],why:'You krijgt are, ook als je meerdere personen bedoelt.'},
{ id:'f12',level:'future',type:'build',title:'Bouw de Engelse zin',prompt:'Zij zullen hem een berichtje sturen.',tokens:['They','will','text','him.'],why:'They will text him. Will verandert nooit, ook niet bij they.'},
{ id:'j1',level:'jobs',type:'mc',title:'Kies de goede vraag',prompt:'Wat wil je worden als je groot bent?',correct:'What do you want to be when you grow up?',wrong:['What you want be when you grow up?','What does you want to be when you grow up?','What do you want to when you grow up?'],why:'Onthoud de vaste vraag: What do you want to be when you grow up?'},
{ id:'j2',level:'jobs',type:'build',title:'Bouw de Engelse zin',prompt:'Als ik groot ben, wil ik astronaut worden.',tokens:['When','I','grow','up,','I','want','to','be','an','astronaut.'],why:'Bij astronaut zeg je an, omdat het woord met een klinkerklank begint.'},
{ id:'j3',level:'jobs',type:'mc',title:'Kies a of an',prompt:'I want to be ___ astronaut.',correct:'an',wrong:['a','is','the an'],why:'An astronaut: het woord astronaut begint met een klinkerklank.'},
{ id:'j4',level:'jobs',type:'mc',title:'Kies a of an',prompt:'I want to be ___ flight attendant.',correct:'a',wrong:['an','are','the an'],why:'Flight begint met de medeklinkerklank f. Dus a flight attendant.'},
{ id:'j5',level:'jobs',type:'mc',title:'Maak de zin af',prompt:'He ___ a police officer.',correct:'is',wrong:['are','am','be'],why:'He = is. He is a police officer.'},
{ id:'j6',level:'jobs',type:'build',title:'Bouw de Engelse zin',prompt:'Zij is serveerster, net als mijn moeder.',tokens:['She','is','a','waitress,','just','like','my','mother.'],why:'Just like my mother betekent net als mijn moeder.'},
{ id:'j7',level:'jobs',type:'mc',title:'Kies de correcte zin',prompt:'Het zijn dokters.',correct:'They are doctors.',wrong:['They is doctors.','They are a doctors.','They am doctors.'],why:'They are is meervoud. Bij doctors zet je geen a.'},
{ id:'j8',level:'jobs',type:'mc',title:'Wat betekent dit?',prompt:'just like my grandmother',correct:'net als mijn oma',wrong:['alleen mijn oma','anders dan mijn oma','net als mijn moeder'],why:'Just like = net als. Grandmother = oma.'},
{ id:'j9',level:'jobs',type:'build',title:'Bouw de Engelse zin',prompt:'Als ik groot ben, wil ik steward of stewardess worden.',tokens:['When','I','grow','up,','I','want','to','be','a','flight','attendant.'],why:'Flight attendant is een neutraal Engels woord voor steward of stewardess.'},
{ id:'j10',level:'jobs',type:'mc',title:'Kies het goede antwoord',prompt:'___ is a waitress, just like my sister.',correct:'She',wrong:['They','We','I'],why:'She is betekent zij is.'},
{ id:'j11',level:'jobs',type:'mc',title:'Welk beroep hoort erbij?',prompt:'dierenarts',correct:'vet',wrong:['dentist','pilot','chef'],why:'Vet is dierenarts; dentist is tandarts.'},
{ id:'j12',level:'jobs',type:'mc',title:'Welk beroep hoort erbij?',prompt:'politieagent',correct:'police officer',wrong:['flight attendant','astronaut','doctor'],why:'Police officer betekent politieagent.'},
{ id:'c1',level:'chores',type:'mc',title:'Kies de juiste vertaling',prompt:'Ik zet nooit de vuilnisbak buiten.',correct:'I never take out the bin.',wrong:['I take never out the bin.','I never takes out the bin.','I am never take out the bin.'],why:'Never staat vóór het werkwoord take.'},
{ id:'c2',level:'chores',type:'build',title:'Bouw de Engelse zin',prompt:'Wij koken soms een maaltijd.',tokens:['We','sometimes','cook','a meal.'],why:'Sometimes = soms. Het staat vóór cook.'},
{ id:'c3',level:'chores',type:'mc',title:'Maak de zin af',prompt:'They ___ do the dishes.',correct:'often',wrong:['oftens','are often','does often'],why:'Often betekent vaak; They often do the dishes.'},
{ id:'c4',level:'chores',type:'mc',title:'Kies de juiste zin',prompt:'Hij gaat meestal winkelen.',correct:'He usually goes shopping.',wrong:['He usually go shopping.','He goes usually shopping.','He usually going shopping.'],why:'Bij he gebruik je goes. Usually staat voor het werkwoord.'},
{ id:'c5',level:'chores',type:'build',title:'Bouw de Engelse zin',prompt:'Zij ruimt altijd op.',tokens:['She','always','cleans','up.'],why:'She krijgt cleans met een -s. Always = altijd.'},
{ id:'c6',level:'chores',type:'mc',title:'Wat betekent dit?',prompt:'I make my bed daily.',correct:'Ik maak elke dag mijn bed op.',wrong:['Ik maak elke week mijn bed op.','Ik ruim elke maand mijn kamer op.','Ik verschoon elke dag de lakens.'],why:'Daily betekent dagelijks, dus elke dag.'},
{ id:'c7',level:'chores',type:'build',title:'Bouw de Engelse zin',prompt:'Wij ruimen wekelijks op.',tokens:['We','tidy','up','weekly.'],why:'Weekly = wekelijks. Bij we gebruik je tidy, niet tidies.'},
{ id:'c8',level:'chores',type:'mc',title:'Maak de zin af',prompt:'He ___ up weekly.',correct:'tidies',wrong:['tidy','tidys','tidying'],why:'Tidy wordt tidies bij he of she: y verandert in ies.'},
{ id:'c9',level:'chores',type:'mc',title:'Kies de juiste zin',prompt:'Zij doet maandelijks de afwas.',correct:'She does the dishes monthly.',wrong:['She do the dishes monthly.','She does the dishes daily.','She does the dishes week.'],why:'She does (niet do). Monthly betekent maandelijks.'},
{ id:'c10',level:'chores',type:'build',title:'Bouw de Engelse zin',prompt:'Zij laten dagelijks de hond uit.',tokens:['They','walk','the dog','daily.'],why:'They walk the dog daily. Daily staat achteraan.'},
{ id:'c11',level:'chores',type:'mc',title:'Kies de juiste volgorde',prompt:'Zij doet vaak de afwas.',correct:'She often does the dishes.',wrong:['She does often the dishes.','She often do the dishes.','She is often does the dishes.'],why:'Often staat vóór does. She = does.'},
{ id:'c12',level:'chores',type:'mc',title:'Kies het Engelse woord',prompt:'maandelijks',correct:'monthly',wrong:['weekly','daily','usually'],why:'Daily = dagelijks, weekly = wekelijks, monthly = maandelijks.'}
];
let session=null,ticker=null,ttsOn=true;
const app=document.getElementById('app'), scorebox=document.getElementById('scorebox');
const safeGet=(k,def=0)=>{try{return JSON.parse(localStorage.getItem(k))??def}catch{return def}};
const safeSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};
let xp=safeGet('xavier-grammar-xp',0), best=safeGet('xavier-grammar-best',0);
function updateScore(){scorebox.textContent='⭐ '+xp+' XP'}updateScore();
function shuffle(array){let a=array.slice();for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function escapeHtml(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const cap=(s)=>s.charAt(0).toUpperCase()+s.slice(1);
function clearTimer(){if(ticker!==null){clearInterval(ticker);ticker=null}}
function setScreen(html){clearTimer();app.innerHTML=html;window.scrollTo({top:0,behavior:'instant'})}
function levelFor(id){return LEVELS.find(x=>x.id===id)}
function home(){session=null;let record=best?`<div class="record">🏆 Je beste toetsscore: ${best}/18</div>`:'';setScreen(`<section class="panel"><div class="hero"><div><div class="eyebrow">MISSIE · ENGELS</div><h1>Het Zinnenlab</h1><p>Reis langs drie werelden. Leer Engelse zinnen bouwen, verzamel sterren en versla de eindbaas!</p></div><div class="planet" aria-hidden="true">🌎</div></div><div class="modes"><button class="modecard" id="goTrain"><span>🎮</span><strong>Trainen</strong><small>Oefenen met hulp, woordpuzzels en uitleg. Je kiest zelf het level.</small></button><button class="modecard" id="goExam"><span>🏆</span><strong>Eindbaas: toets</strong><small>18 verrassingsvragen · 10 seconden denktijd per vraag · geen hints.</small></button></div>${record}<div class="squiggle"></div><div class="howto">Gebaseerd op je Engelse lesblad: <strong>Stone 1.1, 1.2 en 1.3</strong>. De antwoorden verschijnen bij het trainen na elke vraag, en in de toets pas op het einde.</div></section>`);document.getElementById('goTrain').onclick=chooseTrain;document.getElementById('goExam').onclick=examIntro}
function chooseTrain(){setScreen(`<section class="panel"><p class="eyebrow">Kies je wereld</p><h1 class="questionTitle">Welk level train je?</h1><p class="muted">In ieder level oefen je 12 opdrachten. Je krijgt direct uitleg bij je antwoord.</p><div class="levelgrid">${LEVELS.map(l=>`<button class="levelcard" data-id="${l.id}"><div class="emoji">${l.emoji}</div><div class="number">${l.stone}</div><strong>${l.title}</strong><p>${l.about}</p></button>`).join('')}</div><div class="btnrow"><button class="btn ghost" id="back">← Hoofdmenu</button></div></section>`);app.querySelectorAll('.levelcard').forEach(e=>e.onclick=()=>levelIntro(e.dataset.id));document.getElementById('back').onclick=home}
function levelIntro(id){let l=levelFor(id);setScreen(`<section class="panel"><p class="eyebrow">${l.stone} · ${l.title}</p><h1 class="questionTitle">${l.emoji} Jouw spiektraining</h1><p class="muted">Lees de geheime regels. Daarna ga je zinnen kraken!</p><div class="rules">${l.rules.map(r=>`<div class="rule"><strong>${r[0]}</strong>${r[1]}</div>`).join('')}</div><div class="btnrow"><button class="btn" id="start">Start 12 opdrachten →</button><button class="btn ghost" id="back">← Kies level</button></div></section>`);document.getElementById('start').onclick=()=>startSession('train',shuffle(BANK.filter(q=>q.level===id)));document.getElementById('back').onclick=chooseTrain}
function examIntro(){setScreen(`<section class="panel"><p class="eyebrow">EINDMISSIE</p><h1 class="questionTitle">🏆 Versla de eindbaas</h1><p>Je krijgt <strong>18 vragen</strong>: zes over toekomst, zes over beroepen en zes over klusjes.</p><div class="rules"><div class="rule"><strong>⏳ 10 seconden denktijd</strong>Je mag pas na de aftelling antwoorden.</div><div class="rule"><strong>🔒 Zonder spiekhulp</strong>Je ziet het juiste antwoord pas na de hele toets.</div><div class="rule"><strong>🎯 Doel: 15/18 of meer</strong>Na afloop zie je welke zinnen je nog moet oefenen.</div></div><label class="toggle"><input id="speech" type="checkbox" ${ttsOn?'checked':''}/> Engelse zinnen op verzoek laten voorlezen (als je tablet dit ondersteunt)</label><div class="btnrow"><button class="btn warm" id="start">Begin de toets →</button><button class="btn ghost" id="back">← Hoofdmenu</button></div></section>`);document.getElementById('speech').onchange=e=>ttsOn=e.target.checked;document.getElementById('start').onclick=()=>{let picked=[];for(const l of LEVELS){const source=BANK.filter(q=>q.level===l.id), builders=shuffle(source.filter(q=>q.type==='build')).slice(0,2), choices=shuffle(source.filter(q=>q.type==='mc')).slice(0,4);picked.push(...builders,...choices)}startSession('exam',shuffle(picked))};document.getElementById('back').onclick=home}
function startSession(mode,questions){session={mode,questions,idx:0,results:[],selected:[],options:[],answerIds:[],allowed:false,locked:false,started:0,raw:''};showQuestion()}
function spoken(text){if(!ttsOn||!('speechSynthesis' in window))return;window.speechSynthesis.cancel();let v=new SpeechSynthesisUtterance(text);v.lang='en-GB';v.rate=.83;window.speechSynthesis.speak(v)}
function speakButton(text){if(!('speechSynthesis' in window)||!ttsOn)return '';return `<button class="tts" id="speak" type="button" aria-label="Lees Engels voor">🔊 Hoor het Engels</button>`}
function showQuestion(){if(!session)return;let s=session,q=s.questions[s.idx];s.selected=[];s.allowed=false;s.locked=false;s.raw='';s.started=Date.now();const l=levelFor(q.level);let mc=q.type==='mc';s.options=mc?shuffle([q.correct,...q.wrong]):[];
if(!mc){s.answerIds=shuffle(q.tokens.map((txt,i)=>({txt,id:i})));}
const n=s.idx+1,total=s.questions.length;setScreen(`<section class="panel"><div class="headrow"><span class="pill">${l.emoji} ${l.stone} · ${l.title}</span><span class="miniStat">Vraag ${n} van ${total}</span></div><div class="progressOuter" role="progressbar" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${s.idx}"><div class="progressInner" style="width:${s.idx/total*100}%"></div></div><div class="eyebrow">${s.mode==='exam'?'🏆 TOETSMISSIE':'🎮 TRAININGSMISSIE'}</div><h2 class="questionTitle">${escapeHtml(q.title)}</h2><div class="prompt"><label>${q.type==='build'?'Zeg dit in het Engels':'Lees en denk na'}</label><p>${escapeHtml(q.prompt)}</p></div>${true?`<div id="timer" class="timerbox"><span class="timerCircle" id="clock">10</span><span id="timerText">Kijk goed! Je kunt antwoorden over 10 seconden.</span></div>`:''}${mc?`<div class="options">${s.options.map((opt,i)=>`<button class="option" data-choice="${i}" ${!s.allowed?'disabled':''}><span class="letter">${'ABCD'[i]}</span><span>${escapeHtml(opt)}</span></button>`).join('')}</div>`:`<div class="buildAnswer empty" id="answer" aria-label="Jouw zin"></div><div class="chipArea" id="tokens">${s.answerIds.map(t=>`<button class="chip" data-token="${t.id}" ${!s.allowed?'disabled':''}>${escapeHtml(t.txt)}</button>`).join('')}</div><div class="btnrow"><button class="btn" id="submit" disabled>Controleer mijn zin ✓</button><button class="btn ghost" id="clear" ${!s.allowed?'disabled':''}>Opnieuw leggen</button></div>`}<div class="footerActions"><button class="btn ghost" id="leave">✕ Stoppen</button></div>${s.mode==='train'?`<p class="howto">Tip: je mag rustig nadenken. Bij fouten krijg je uitleg.</p>`:''}</section>`);
app.querySelectorAll('[data-choice]').forEach(btn=>btn.onclick=()=>accept(s.options[Number(btn.dataset.choice)]));
if(!mc){app.querySelectorAll('[data-token]').forEach(el=>el.onclick=()=>{s.selected.push(Number(el.dataset.token));renderBuild()});document.getElementById('submit').onclick=()=>accept(joinTokens(s.selected.map(id=>q.tokens[id])));document.getElementById('clear').onclick=()=>{s.selected=[];renderBuild()};renderBuild();}
document.getElementById('leave').onclick=()=>{if(confirm('Stoppen met deze ronde? Je voortgang van deze ronde wordt niet opgeslagen.'))home()};
{let until=s.started+10000;function tick(){if(!session||session!==s||s.locked)return;let remaining=Math.max(0,Math.ceil((until-Date.now())/1000));const clock=document.getElementById('clock'),timer=document.getElementById('timer'),text=document.getElementById('timerText');if(!clock||!timer||!text){clearTimer();return}clock.textContent=String(remaining);if(remaining===0){clearTimer();s.allowed=true;timer.classList.add('ready');text.textContent='Je mag antwoorden!';updateControls()}}tick();ticker=setInterval(tick,150)}
}
function updateControls(){if(!session)return;let allowed=session.allowed&&!session.locked;app.querySelectorAll('.option,[data-token]').forEach(e=>{if(e.hasAttribute('data-token')){e.disabled=!allowed||session.selected.includes(Number(e.dataset.token))}else e.disabled=!allowed});let c=document.getElementById('clear'),btn=document.getElementById('submit');if(c)c.disabled=!allowed||session.selected.length===0;if(btn)btn.disabled=!allowed||session.selected.length!==session.questions[session.idx].tokens.length}
function joinTokens(xs){return xs.map((x,i)=>x).join(' ').replace(/\s+([,.!?])/g,'$1')}
function renderBuild(){if(!session||session.locked)return;const s=session,q=s.questions[s.idx];let target=document.getElementById('answer');if(!target)return;target.classList.toggle('empty',s.selected.length===0);target.innerHTML=s.selected.map((id,i)=>`<button class="chip chosen" type="button" data-placed="${i}" ${!s.allowed?'disabled':''} title="Verwijder dit woord">${escapeHtml(q.tokens[id])} ✕</button>`).join('');target.querySelectorAll('[data-placed]').forEach(e=>e.onclick=()=>{s.selected.splice(Number(e.dataset.placed),1);renderBuild()});updateControls()}
function accept(value){const s=session;if(!s||!s.allowed||s.locked||Date.now()<s.started+10000)return;const q=s.questions[s.idx];if(q.type==='build'&&s.selected.length!==q.tokens.length)return;s.locked=true;clearTimer();const correct=q.type==='build'?joinTokens(q.tokens):q.correct;const ok=(value===correct);s.results.push({id:q.id,level:q.level,title:q.title,prompt:q.prompt,answer:correct,given:value,ok,why:q.why});if(s.mode==='train'){if(ok){xp+=10;safeSet('xavier-grammar-xp',xp);updateScore()}feedback(q,ok,correct,value)}else{if(s.idx+1===s.questions.length){finish()}else{const n=s.idx+1;setScreen(`<section class="panel"><div class="confetti">🗝️</div><p class="eyebrow">Antwoord opgeslagen</p><h2 class="questionTitle">Nog ${s.questions.length-n} vragen te gaan</h2><p class="muted">De antwoorden blijven geheim tot je klaar bent met de hele toets.</p><div class="btnrow"><button class="btn warm" id="next">Volgende vraag →</button></div></section>`);document.getElementById('next').onclick=nextQuestion}}}
function feedback(q,ok,right,given){let nextLabel=session.idx+1===session.questions.length?'Bekijk je uitslag':'Volgende opdracht →';setScreen(`<section class="panel"><p class="eyebrow">${levelFor(q.level).stone} · ${session.idx+1}/${session.questions.length}</p><div class="feedback ${ok?'good':'bad'}"><h3>${ok?'🌟 Helemaal goed!':'🧩 Bijna! Hier leer je van.'}</h3><p>${escapeHtml(q.prompt)}</p>${!ok?`<p>Jouw antwoord: <strong>${escapeHtml(given)}</strong></p>`:''}<div class="rightAnswer">${escapeHtml(right)}</div><p class="explain">💡 ${escapeHtml(q.why)}</p></div>${speakButton(right)}<div class="btnrow"><button class="btn ${ok?'':'warm'}" id="next">${nextLabel}</button></div></section>`);let say=document.getElementById('speak');if(say)say.onclick=()=>spoken(right);document.getElementById('next').onclick=nextQuestion}
function nextQuestion(){if(!session)return;session.idx++;if(session.idx>=session.questions.length)finish();else showQuestion()}
function finish(){if(!session)return;let s=session,total=s.results.length,score=s.results.filter(r=>r.ok).length,wrong=s.results.filter(r=>!r.ok);if(s.mode==='exam'){let bonus=score*12;xp+=bonus;safeSet('xavier-grammar-xp',xp);updateScore();best=Math.max(best,score);safeSet('xavier-grammar-best',best)}let grade=score===total?'PERFECT!':score>=Math.ceil(total*.83)?'Missie geslaagd!':score>=Math.ceil(total*.6)?'Bijna een expert!':'Nog even trainen!';let stats=LEVELS.map(l=>{let recs=s.results.filter(r=>r.level===l.id);return {label:l.stone,emoji:l.emoji,score:recs.filter(r=>r.ok).length,total:recs.length}});let gradeText=s.mode==='exam'?(score>=15?'🏆 De eindbaas is verslagen!':'🛠️ Train je lastige zinnen en probeer het opnieuw.'):'🌟 Je hebt een hele wereld geoefend!';setScreen(`<section class="panel"><p class="eyebrow">${s.mode==='exam'?'🏆 Eindbaas-verslag':'🎮 Trainingsverslag'}</p><div class="confetti">${score===total?'🎉🏆🎉':'🚀⭐🚀'}</div><h1 class="questionTitle" style="text-align:center">${grade}</h1><div class="resultNumber">${score} / ${total}</div><p class="resultSub">${gradeText}</p><div class="report">${stats.filter(x=>x.total>0).map(x=>`<div><small>${x.emoji} ${x.label}</small>${x.score}/${x.total}</div>`).join('')}</div><h2 class="questionTitle" style="font-size:21px">${wrong.length?'Deze zinnen kun je nog oefenen':'Alles goed! Geen fouten.'}</h2>${wrong.length?`<div class="wrongList">${wrong.map(r=>`<div class="wrongItem"><div>❌ ${escapeHtml(r.prompt)}</div><small>Jouw antwoord: ${escapeHtml(r.given)}</small><strong>✓ ${escapeHtml(r.answer)}</strong><small>💡 ${escapeHtml(r.why)}</small></div>`).join('')}</div>`:'<p class="muted">Je hebt alle zinnen van deze ronde goed!</p>'}<div class="btnrow"><button class="btn" id="home">Terug naar het menu</button>${wrong.length?`<button class="btn warm" id="retry">Oefen ${wrong.length} fout${wrong.length===1?'':'en'} opnieuw</button>`:''}${s.mode==='exam'?'<button class="btn alt" id="exam">Nieuwe toets</button>':''}<button class="btn ghost" id="copy">📋 Kopieer uitslag</button></div><div id="copyStatus" class="howto" aria-live="polite"></div></section>`);document.getElementById('home').onclick=home;let retry=document.getElementById('retry');if(retry)retry.onclick=()=>startSession('train',shuffle(wrong.map(r=>BANK.find(q=>q.id===r.id))));let re=document.getElementById('exam');if(re)re.onclick=examIntro;document.getElementById('copy').onclick=()=>copyReport(s,score,total,stats,wrong)}
async function copyReport(s,score,total,stats,wrong){let msg=`Xavier's English Quest — ${s.mode==='exam'?'Toets':'Training'}\nScore: ${score}/${total}\n${stats.filter(a=>a.total>0).map(x=>`${x.label}: ${x.score}/${x.total}`).join('\n')}\n${wrong.length?'\nNog oefenen:\n'+wrong.map(r=>`- ${r.prompt}\n  Goed: ${r.answer}`).join('\n'):'\nAlles goed!'}\n`;try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(msg)}else{let ta=document.createElement('textarea');ta.value=msg;document.body.appendChild(ta);ta.select();let copied=document.execCommand('copy');ta.remove();if(!copied)throw new Error('copy failed')}document.getElementById('copyStatus').textContent='✅ De uitslag is gekopieerd. Plak hem in een bericht aan je ouder.'}catch{document.getElementById('copyStatus').textContent='Kopiëren lukt hier niet. Maak eventueel een screenshot van de uitslag.'}}
home();
</script>
